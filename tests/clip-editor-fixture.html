<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#eee;font:14px system-ui}main{padding:24px}button,input{font:inherit;color:inherit;background:#24242c;border:1px solid #444;padding:8px;border-radius:5px;cursor:pointer}.source{height:200px;max-height:240px;background:#202832}.source video{height:100%;width:100%}#clip-creator-dialog{position:absolute;top:90px;right:20px;width:410px;background:#222;padding:16px}h2{margin:0 0 12px;font-size:17px}header{display:flex;align-items:center;justify-content:space-between}.preview{position:relative;aspect-ratio:16/9;background:radial-gradient(ellipse at 30% 70%,#314b3a,#161621)}.preview video{width:100%;height:100%}.native-title{display:block;margin:10px 0;width:100%}.track{height:48px;position:relative;background:repeating-linear-gradient(90deg,#282b30 0 13px,#22252a 13px 15px);border-radius:8px;overflow:hidden;margin-top:14px}.selection{position:absolute;top:0;bottom:0;display:flex}.selection>div{border:4px solid #fff}.selection>div:first-child,.selection>div:last-child{width:16px;background:#555;flex:none;cursor:ew-resize}.selection>div:nth-child(2){flex:1;cursor:grab}.tooltip{height:42px;text-align:center;padding-top:5px;color:#999;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}[role=slider]{width:100%;height:12px;display:block;background:#393944;outline:none}a{color:#cfc}.fixture-avatar{width:24px;height:24px;border-radius:50%;background:#63836d}
</style></head><body><main><div id="injected-channel-player" class="source"><div style="max-width:440px;width:440px;height:246px;margin:auto;position:relative"><div style="width:440px;height:246px;aspect-ratio:16/9;position:relative"><video id="source-player" muted loop></video></div></div><div class="z-controls bottom-0"><button aria-label="Clip" data-native-clip>Clip</button><span role="slider" aria-label="Current video time" aria-valuemin="0" aria-valuemax="10800000" aria-valuenow="0"></span></div></div></main>
<script>
window.clipCalls={opens:0,publishes:0,downloads:0,chat:0};window.rangeState={start:150,end:180,total:180};
Object.defineProperty(document.querySelector('#source-player'),'duration',{get:()=>10800});
const og=document.createElement('meta');og.setAttribute('property','og:video');og.content='https://stream.kick.com/test/media/hls/master.m3u8';document.head.append(og);
window.addEventListener('openClipCreator',event=>{window.receivedNativeClip=event.detail;rangeState={start:150,end:180,total:180};openNativeClip();});
function openNativeClip(){
 if(document.getElementById('clip-creator-dialog'))return;clipCalls.opens++;
 const dialog=document.createElement('div');dialog.id='clip-creator-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-label','Create clip');
 dialog.innerHTML='<header><h2>Create clip</h2><button aria-label="Close clip editor" data-close>✕</button></header><form><div class="preview"><video id="clip-creator-player" muted></video><span role="slider" aria-label="Current video time" aria-valuemin="150000" aria-valuemax="180000" aria-valuenow="150000" tabindex="0"></span></div><input class="native-title" data-testid="clip-creator-title" placeholder="Give this moment a title" maxlength="50"><div class="track"><div class="selection"><div data-testid="clip-cropper-start" aria-hidden="true"></div><div data-testid="clip-cropper-range" aria-hidden="true"></div><div data-testid="clip-cropper-end" aria-hidden="true"></div></div></div><div class="tooltip"></div><div class="actions"><button type="button" data-close>Cancel</button><button data-testid="clip-creator-publish">Publish</button></div></form>';
 // Model Kick's nested, full-height mobile form: the video and fields live in
 // one column, with the native actions as a sibling below that column.
 const form=dialog.querySelector('form'),body=document.createElement('div'),main=document.createElement('div'),previewOuter=document.createElement('div'),fields=document.createElement('div');
 body.className='native-form-body';body.style.cssText='display:flex;flex-direction:column;justify-content:space-between;height:100%;gap:12px';
 main.style.cssText='display:flex;flex-direction:column;gap:12px';previewOuter.className='aspect-video';previewOuter.style.cssText='aspect-ratio:16/9;width:100%;background:black';
 previewOuter.append(form.querySelector('.preview'));fields.style.cssText='display:flex;flex-direction:column;gap:12px';
 for(const child of [...form.children])if(!child.matches('.actions'))fields.append(child);
 main.append(previewOuter,fields);body.append(main,form.querySelector('.actions'));form.append(body);form.style.height='100%';
 document.body.append(dialog);window.originalNativeForm=dialog.querySelector('form');
 function draw(){const s=rangeState,selected=dialog.querySelector('.selection');if(!selected)return;selected.style.left=s.start/s.total*100+'%';selected.style.width=(s.end-s.start)/s.total*100+'%';dialog.querySelector('.tooltip').textContent=Math.round(s.end-s.start)+'s / '+s.total+'s · '+s.start.toFixed(0)+' - '+s.end.toFixed(0);const slider=dialog.querySelector('[role=slider]');slider.setAttribute('aria-valuemin',s.start*1000);slider.setAttribute('aria-valuemax',s.end*1000);}
 draw();
 let moving=null;
 dialog.addEventListener('pointerdown',event=>{const part=event.target.dataset.testid;if(!part?.startsWith('clip-cropper-')||event.button!==0||!event.isPrimary)return;moving={part:part.split('-').pop(),x:event.clientX,start:rangeState.start,end:rangeState.end};});
 const move=event=>{if(!moving||!dialog.isConnected)return;const s=rangeState,delta=(event.clientX-moving.x)/dialog.querySelector('.track').getBoundingClientRect().width*s.total;
 if(moving.part==='range'){s.start=Math.max(0,Math.min(s.total-(moving.end-moving.start),moving.start+delta));s.end=s.start+(moving.end-moving.start);}
 else if(moving.part==='start')s.start=Math.max(0,Math.min(s.end-10,Math.max(s.end-180,moving.start+delta)));
 else s.end=Math.max(s.start+10,Math.min(s.total,s.start+180,moving.end+delta));draw();};
 const up=()=>moving=null;window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
 function close(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);dialog.remove();}
 dialog.addEventListener('click',event=>{if(event.target.closest('[data-close]'))close();});
 dialog.querySelector('[role=slider]').addEventListener('keydown',event=>{const slider=event.target,old=Number(slider.getAttribute('aria-valuenow'));const value=event.key==='Home'?rangeState.start*1000:event.key==='End'?rangeState.end*1000:old+(event.key==='ArrowLeft'?-1000:1000);slider.setAttribute('aria-valuenow',Math.max(rangeState.start*1000,Math.min(rangeState.end*1000,value)));event.preventDefault();});
 dialog.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const title=dialog.querySelector('input').value;if(!title.trim())return;clipCalls.publishes++;dialog.querySelector('form').remove();const success=document.createElement('div');success.innerHTML='<h3>Clip created</h3><input data-testid="clip-share-url" value="https://kick.com/alpha/clips/clip_00000000000000000000000001" readonly><button data-download>Download</button><button data-chat>Chat</button>';dialog.append(success);success.querySelector('[data-download]').addEventListener('click',()=>{clipCalls.downloads++;const modal=document.createElement('div');modal.id='download-dialog';modal.setAttribute('role','dialog');modal.setAttribute('aria-label','Download clip');modal.style.cssText='position:fixed;inset:20%;z-index:50;padding:20px;background:#25252c';modal.innerHTML='<h2>Download clip</h2><button>Close download</button>';modal.querySelector('button').addEventListener('click',()=>modal.remove());document.body.append(modal);});success.querySelector('[data-chat]').addEventListener('click',()=>clipCalls.chat++);});
}
document.querySelector('[data-native-clip]').addEventListener('click',openNativeClip);
</script></body></html>
